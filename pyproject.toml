[project]
name = "oflm"
version = "0.1.0"
description = "Generative model of market order flow, evaluated as a backtesting simulator"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "polars>=1.0",
    "pyarrow>=16",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oflm"]
